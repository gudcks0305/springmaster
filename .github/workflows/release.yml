---
# Release springmaster with its matching Java analyzer. Every platform archive
# contains both runtime components; the top-level checksum covers the archives.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build (for example v0.1.0)'
        required: true
        type: string

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Determine version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be vMAJOR.MINOR.PATCH: $tag" >&2
            exit 4
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
          cache-dependency-path: go.mod

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          java-version: '25'
          distribution: temurin
          check-latest: true

      - name: Cache Gradle dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('build.gradle', 'settings.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm test
          npm run build

      - name: Verify Go control plane
        run: |
          go vet ./...
          go test -race ./...

      - name: Verify backend
        run: ./gradlew test integrationTest spotlessCheck --no-daemon --console=plain

      - name: Build analyzer jar
        run: ./gradlew bootJar --no-daemon --console=plain

      - name: Package supported platforms
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          release_dir=dist/release
          component_dir=dist/components
          mkdir -p "$release_dir" "$component_dir"
          cp build/libs/spring-boot-analyzer.jar "$component_dir/analyzer.jar"
          cp "$component_dir/analyzer.jar" "$release_dir/analyzer.jar"

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            binary=springmaster
            extension=tar.gz
            if [ "$os" = windows ]; then
              binary=springmaster.exe
              extension=zip
            fi

            package="springmaster_${RELEASE_TAG}_${os}_${arch}"
            staging=$(mktemp -d)
            trap 'rm -rf "$staging"' EXIT
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o "$staging/$binary" ./cmd/springmaster
            cp "$component_dir/analyzer.jar" "$staging/analyzer.jar"
            (
              cd "$staging"
              sha256sum "$binary" analyzer.jar > SHA256SUMS
            )
            if [ "$os" = windows ]; then
              (
                cd "$staging"
                zip -q "$GITHUB_WORKSPACE/$release_dir/$package.$extension" "$binary" analyzer.jar SHA256SUMS
              )
            else
              tar -C "$staging" -czf "$release_dir/$package.$extension" "$binary" analyzer.jar SHA256SUMS
            fi
            rm -rf "$staging"
            trap - EXIT
          done

          (
            cd "$release_dir"
            sha256sum analyzer.jar springmaster_* > SHA256SUMS
          )

      - name: Verify release archives and packaged runtime
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          release_dir=dist/release
          verify_root=$(mktemp -d)
          trap 'rm -rf "$verify_root"' EXIT

          (
            cd "$release_dir"
            sha256sum -c SHA256SUMS
          )

          for archive in "$release_dir"/*.tar.gz; do
            name=$(basename "$archive" .tar.gz)
            extracted="$verify_root/$name"
            mkdir -p "$extracted"
            tar -xzf "$archive" -C "$extracted"
            diff -u <(printf '%s\n' SHA256SUMS analyzer.jar springmaster | sort) \
              <(find "$extracted" -maxdepth 1 -type f -printf '%f\n' | sort)
            test -x "$extracted/springmaster"
            (
              cd "$extracted"
              sha256sum -c SHA256SUMS
            )
          done

          for archive in "$release_dir"/*.zip; do
            name=$(basename "$archive" .zip)
            extracted="$verify_root/$name"
            mkdir -p "$extracted"
            unzip -q "$archive" -d "$extracted"
            diff -u <(printf '%s\n' SHA256SUMS analyzer.jar springmaster.exe | sort) \
              <(find "$extracted" -maxdepth 1 -type f -printf '%f\n' | sort)
            test -f "$extracted/springmaster.exe"
            (
              cd "$extracted"
              sha256sum -c SHA256SUMS
            )
          done

          package_dir="$verify_root/springmaster_${RELEASE_TAG}_linux_amd64"
          "$package_dir/springmaster" --help | grep -F 'springmaster scan ROOT'

          fixture="$verify_root/fixture"
          mkdir -p "$fixture/src/main/java/example"
          git init --quiet "$fixture"
          git -C "$fixture" config user.email release-smoke@example.invalid
          git -C "$fixture" config user.name release-smoke
          cat > "$fixture/pom.xml" <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>example</groupId>
            <artifactId>release-smoke</artifactId>
            <version>1.0.0</version>
          </project>
          POM
          cat > "$fixture/src/main/java/example/FixtureApplication.java" <<'JAVA'
          package example;

          import org.springframework.boot.autoconfigure.SpringBootApplication;

          @SpringBootApplication
          public class FixtureApplication {}
          JAVA
          git -C "$fixture" add pom.xml src/main/java/example/FixtureApplication.java
          git -C "$fixture" commit --quiet -m 'release smoke fixture'

          report="$verify_root/scan.json"
          "$package_dir/springmaster" scan "$fixture" \
            --worker-command "java -jar $package_dir/analyzer.jar --worker" \
            --mode STATIC_ONLY \
            --format json \
            --fail-on none \
            --no-cache \
            --timeout 2m > "$report"
          # shellcheck disable=SC2016
          node -e '
            const report = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (report.summary?.repositories !== 1 || report.summary?.completed !== 1 || report.summary?.failed !== 0) {
              throw new Error(`unexpected packaged scan report: ${JSON.stringify(report.summary)}`);
            }
          ' "$report"

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Springmaster ${{ steps.version.outputs.tag }}
          draft: true
          generate_release_notes: true
          body: |
            Each platform archive includes its matching `springmaster` binary,
            `analyzer.jar`, and component checksum file. A standalone
            `analyzer.jar` remains available for the original Java CLI. Verify
            downloaded assets with the top-level `SHA256SUMS` before use.
          files: |
            dist/release/*
          fail_on_unmatched_files: true
