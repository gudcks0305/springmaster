import java.time.Duration

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.13'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '7.0.4'
}

group = 'io.github.robbanhoglund'
version = '0.1.0'
description = 'spring-boot-analyzer'

repositories {
    // Optional internal mirror for dependency resolution; see the pluginManagement block in
    // settings.gradle for how corpRepoUrl is configured. Absent property = public repositories.
    def corpRepoUrl = providers.gradleProperty('corpRepoUrl').orNull
    def corpRepoUsername = providers.gradleProperty('corpRepoUsername').orNull
    def corpRepoPassword = providers.gradleProperty('corpRepoPassword').orNull
    if (corpRepoUrl) {
        if (!!corpRepoUsername != !!corpRepoPassword) {
            throw new GradleException(
                'corpRepoUsername and corpRepoPassword must be provided together.'
            )
        }
        maven {
            url = corpRepoUrl
            if (corpRepoUsername && corpRepoPassword) {
                credentials {
                    username = corpRepoUsername
                    password = corpRepoPassword
                }
            }
        }
    }
    maven { url = 'https://repo.gradle.org/gradle/libs-releases' }
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

springBoot {
    mainClass = 'com.robbanhoglund.springbootanalyzer.SpringBootAnalyzerApplication'
}

bootJar {
    archiveFileName = 'spring-boot-analyzer.jar'
    dependsOn 'verifyFrontendBundle'
    from(layout.projectDirectory.dir('frontend/dist')) {
        into 'BOOT-INF/classes/static'
    }
}

tasks.register('verifyFrontendBundle') {
    description = 'Verifies that a compiled frontend bundle is available before packaging the release jar.'
    group = 'verification'
    doLast {
        def frontendDistIndex = layout.projectDirectory.file('frontend/dist/index.html').asFile
        def resourceStaticIndex = layout.projectDirectory.file('src/main/resources/static/index.html').asFile
        if (!frontendDistIndex.isFile() && !resourceStaticIndex.isFile()) {
            throw new GradleException(
                    'Frontend bundle is missing. Run `cd frontend && npm ci && npm run build` before `./gradlew bootJar`.')
        }
    }
}

dependencies {
    implementation 'info.picocli:picocli:4.7.7'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.eclipse.jgit:org.eclipse.jgit:7.7.1.202607240634-r'
    implementation 'org.eclipse.jgit:org.eclipse.jgit.ssh.apache:7.7.1.202607240634-r'
    implementation 'org.gradle:gradle-tooling-api:9.7.1'
    implementation 'com.github.javaparser:javaparser-core:3.28.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    // Network-dependent Gradle Tooling API integration tests are tagged 'integration'
    // and excluded here so the default build stays fast, deterministic, and runnable
    // offline. Run them with `./gradlew integrationTest` (see below).
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

// Opt-in task for the network-dependent Gradle Tooling API integration tests.
// These download a real Gradle distribution and resolve dependencies over the
// network, so they are kept out of the default `test` task. CI runs them
// explicitly where network access is reliable.
tasks.register('integrationTest', Test) {
    description = 'Runs network-dependent Gradle Tooling API integration tests (downloads a real Gradle distribution).'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'integration'
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter test
    // Cold-cache runs download a full Gradle distribution plus dependencies; allow
    // generous headroom over the in-test Tooling API timeout.
    timeout = Duration.ofMinutes(15)
    // Results depend on external network/cache state, so never report UP-TO-DATE.
    outputs.upToDateWhen { false }
}

// Deliberately opt-in: compilation, IDE sync, and CI must never alter a
// checkout's Git hooks. Existing hooks can contain user-managed policy, so
// this task refuses to replace them rather than silently overwriting them.
tasks.register('installGitHooks') {
    description = 'Installs repository Git hooks only when explicitly requested; never overwrites an existing hook.'
    group = 'development'

    inputs.dir(layout.projectDirectory.dir('scripts/hooks'))
    outputs.upToDateWhen { false }

    doLast {
        def gitMetadata = layout.projectDirectory.file('.git').asFile
        if (!gitMetadata.exists()) {
            throw new GradleException(
                'Cannot install hooks: this checkout is not a Git worktree. Install scripts/hooks manually if needed.')
        }

        def sourceDirectory = layout.projectDirectory.dir('scripts/hooks').asFile
        def hooksPath = providers.exec {
            workingDir = layout.projectDirectory.asFile
            commandLine 'git', 'rev-parse', '--git-path', 'hooks'
        }.standardOutput.asText.get().trim()
        def hooksDirectory = file(hooksPath)
        if (!hooksDirectory.exists() && !hooksDirectory.mkdirs()) {
            throw new GradleException("Cannot create Git hooks directory: ${hooksDirectory}")
        }

        def hookSources = sourceDirectory.listFiles()?.findAll { source -> source.isFile() } ?: []
        def existingTargets = hookSources.collect { source -> new File(hooksDirectory, source.name) }
                .findAll { target -> target.exists() }
        if (!existingTargets.isEmpty()) {
            throw new GradleException(
                "Refusing to overwrite existing Git hook(s): ${existingTargets.join(', ')}. Remove them yourself, then rerun installGitHooks.")
        }

        hookSources.each { source ->
            def target = new File(hooksDirectory, source.name)
            target.bytes = source.bytes
            if (!target.setExecutable(true, false)) {
                throw new GradleException("Cannot mark Git hook executable: ${target}")
            }
        }
    }
}

spotless {
    java {
        googleJavaFormat('1.27.0').aosp().reflowLongStrings().skipJavadocFormatting()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
